[project]
name = "trader-bot"
version = "0.1.0"
description = "Crypto trading assistant for Robinhood: walk-forward tested strategies, risk limits, human approval."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "openai",
    "pandas",
    "pynacl",
    "python-dotenv",
    "requests",
    "rich",
]

[project.scripts]
trader = "trader_bot.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader_bot"]
